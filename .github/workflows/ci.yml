name: MVP verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parsing_test
          POSTGRES_USER: parsing
          POSTGRES_PASSWORD: parsing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parsing -d parsing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parsing:parsing@localhost:5432/parsing_test
      TEST_DATABASE_URL: postgresql+psycopg://parsing:parsing@localhost:5432/parsing_test
      ENVIRONMENT: test
      OBJECT_STORAGE_PATH: ${{ github.workspace }}/.ci-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify backend
        working-directory: apps/api
        run: |
          ruff check app tests
          pyright
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run MVP acceptance test
        working-directory: apps/web
        run: npm run test:e2e
