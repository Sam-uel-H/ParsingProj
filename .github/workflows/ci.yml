name: MVP verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: parsing_test
          POSTGRES_USER: parsing
          POSTGRES_PASSWORD: parsing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parsing -d parsing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parsing:parsing@localhost:5432/parsing_test
      TEST_DATABASE_URL: postgresql+psycopg://parsing:parsing@localhost:5432/parsing_test
      ENVIRONMENT: test
      OBJECT_STORAGE_PATH: ${{ github.workspace }}/.ci-storage
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Migrate database
        working-directory: apps/api
        run: .venv/bin/alembic upgrade head

      - name: Verify backend
        working-directory: apps/api
        run: |
          .venv/bin/ruff check app tests
          .venv/bin/pyright
          .venv/bin/pytest

      - name: Verify worker and API crash recovery
        working-directory: apps/api
        env:
          RUN_WORKER_TESTS: '1'
        run: .venv/bin/pytest tests/integration/test_phase11_worker.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run MVP acceptance test
        working-directory: apps/web
        run: |
          ../api/.venv/bin/celery --workdir ../api -A app.jobs.celery_app worker --concurrency=2 --loglevel=warning > /tmp/parsing-worker.log 2>&1 &
          WORKER_PID=$!
          ../api/.venv/bin/celery --workdir ../api -A app.jobs.celery_app beat --loglevel=warning > /tmp/parsing-beat.log 2>&1 &
          BEAT_PID=$!
          trap 'kill "$WORKER_PID" "$BEAT_PID" || true' EXIT
          npm run test:e2e

      - name: Upload browser and worker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics
          path: |
            apps/web/test-results/
            /tmp/parsing-worker.log
            /tmp/parsing-beat.log
