services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parsing
      POSTGRES_USER: parsing
      POSTGRES_PASSWORD: parsing
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsing -d parsing"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - parsing_postgres_data:/var/lib/postgresql/data

volumes:
  parsing_postgres_data:

